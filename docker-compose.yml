# 本地验证用：一键起 MySQL + 后端，模拟生产形态
# 用法（全起）：docker compose up -d            （后端会自动 prisma migrate deploy 再启动）
# 只起数据库（本地 node 跑后端）：docker compose up -d mysql
# 前端用 pnpm dev 通过 Vite proxy 连本机 3000 端口，无需改代码
services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: mall123
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    # 服务端连接数调大（默认 151，容易被多实例 / 多客户端打满）；
    # wait/interactive_timeout 避免空闲连接长期占用。改了 command 需 --force-recreate 才生效。
    command: --default-authentication-plugin=mysql_native_password --max_connections=300 --wait_timeout=28800 --interactive_timeout=28800
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: mall-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://mall:mall123@mysql:3306/mall
      # 连接池：单实例 10，单 backend 实例远小于 mysql 的 300；多实例时按需下调或上调 mysql
      PRISMA_CONNECTION_LIMIT: "10"
      PRISMA_POOL_TIMEOUT: "5"
      PRISMA_CONNECT_TIMEOUT: "10"
      PRISMA_SOCKET_TIMEOUT: "60"
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  mysql-data:
